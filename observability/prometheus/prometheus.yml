# Configuración de Prometheus para observability/compose.yaml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: digitalbank
    metrics_path: /actuator/prometheus
    # Credenciales Basic con las que se protege el endpoint
    # El usuario debe ser igual a METRICS_USER del .env
    # La contraseña se lee de un archivo porque este YAML no expande variables de entorno
    basic_auth:
      username: prometheus-local
      password_file: /etc/prometheus/metrics-password
    static_configs:
      # La aplicación corre fuera del contenedor
      # El nombre con el que el contenedor la alcanza depende de la herramienta
      # Con Podman (recomendado):
      - targets: ['host.containers.internal:8080']
      # Con Docker Desktop:
      #- targets: ['host.docker.internal:8080']
