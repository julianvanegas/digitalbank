services:
  postgres-db:
    image: postgres:15-alpine
    container_name: digitalbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bank}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - digitalbank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-bank}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalbank-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    environment:
      # Sobrescribir el host para que apunte al contenedor en la red interna de Docker
      DB_HOST: postgres-db
      DB_PORT: 5432
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_NAME: ${DB_NAME:-bank}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-this-value-0001}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      VERIFICATION_HMAC_SECRET: ${VERIFICATION_HMAC_SECRET:-dev-only-hmac-secret-change-this-value-0002}
      VERIFICATION_RESEND_INTERVAL_SECONDS: ${VERIFICATION_RESEND_INTERVAL_SECONDS:-60}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-password}
    networks:
      - digitalbank-net

volumes:
  postgres_data:
    driver: local

networks:
  digitalbank-net:
    driver: bridge
