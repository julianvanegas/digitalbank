spring.application.name=digitalbank

# Puerto del servidor HTTP
server.port=${SERVER_PORT}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# Pool de conexiones: máximo de conexiones simultáneas abiertas a la base de datos
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE}
# Cierre de sesión de Hibernate al terminar la transacción del servicio y no la petición HTTP
spring.jpa.open-in-view=false
# SQL de Hibernate (para depurar)
#   org.hibernate.SQL en DEBUG muestra las sentencias SQL
#   org.hibernate.orm.jdbc.bind en TRACE muestra además los valores de los parámetros
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
spring.jpa.properties.hibernate.format_sql=true
# Flyway (migraciones de la base de datos)
spring.flyway.enabled=${FLYWAY_ENABLED}

# Transacciones
spring.transaction.default-timeout=120
spring.transaction.rollback-on-commit-failure=true

# Paginación HTTP
spring.data.web.pageable.max-page-size=100

# Seguridad y tokens (JWT)
# Secreto para JWT (mínimo de 32 caracteres)
jwt.secret=${JWT_SECRET}
# Duración máxima del token en milisegundos; tras este tiempo se debe iniciar sesión de nuevo
jwt.expiration-ms=${JWT_EXPIRATION_MS}
# Minutos de inactividad tras los cuales se cierra la sesión; cada petición renueva el plazo
session.inactivity-timeout-minutes=${SESSION_INACTIVITY_TIMEOUT_MINUTES}
# Clave del HMAC con que se guardan los códigos de verificación 2FA (mínimo 32 caracteres)
verification.hmac-secret=${VERIFICATION_HMAC_SECRET}
# Segundos mínimos entre dos envíos de código al mismo usuario
verification.resend-interval-seconds=${VERIFICATION_RESEND_INTERVAL_SECONDS}

# Secreto que reparte la secuencia de números de cuenta en el rango de 12 dígitos (mínimo 32 caracteres)
account.number-secret=${ACCOUNT_NUMBER_SECRET}

# Servicio de correo (Resend)
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
