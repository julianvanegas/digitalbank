spring.application.name=digitalbank

server.port=${SERVER_PORT}

# Base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway para las migraciones de la base de datos
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Transacciones
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# Content Negotiation
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json

# JWT
# Mínimo 32 caracteres. El valor por defecto es solo para desarrollo:
# en cualquier otro entorno define JWT_SECRET con un valor aleatorio propio.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Verificaciones (2FA, confirmación de email, recuperación de contraseña)
# Clave del HMAC con que se guardan los códigos: mínimo 32 caracteres, distinta de JWT_SECRET.
# El valor por defecto es solo para desarrollo.
verification.hmac-secret=${VERIFICATION_HMAC_SECRET}
verification.resend-interval-seconds=${VERIFICATION_RESEND_INTERVAL_SECONDS}

# Servicio de correo (SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true