spring.application.name=digitalbank

server.port=${SERVER_PORT}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway para las migraciones de la base de datos
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Transacciones
spring.transaction.default-timeout=120
spring.transaction.rollback-on-commit-failure=true

# Content Negotiation
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json

# Paginación HTTP: evita solicitudes con tamaños de página excesivos
spring.data.web.pageable.max-page-size=100

# JWT
# Mínimo 32 caracteres. El valor por defecto es solo para desarrollo:
# en cualquier otro entorno define JWT_SECRET con un valor aleatorio propio.
jwt.secret=${JWT_SECRET}
# Duración máxima del token: tras este tiempo se debe iniciar sesión de nuevo aunque haya actividad
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Sesión: se cierra tras estos minutos sin peticiones autenticadas. Cada petición autenticada renueva el plazo.
session.inactivity-timeout-minutes=${SESSION_INACTIVITY_TIMEOUT_MINUTES}

# Verificaciones (2FA, confirmación de email, recuperación de contraseña)
# Clave del HMAC con que se guardan los códigos: mínimo 32 caracteres, distinta de JWT_SECRET.
# El valor por defecto es solo para desarrollo.
verification.hmac-secret=${VERIFICATION_HMAC_SECRET}
verification.resend-interval-seconds=${VERIFICATION_RESEND_INTERVAL_SECONDS}

# Servicio de correo (Resend)
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

# Números de cuenta: secreto que reparte la secuencia en el rango de 12 dígitos (AccountNumberPermutation).
# Mínimo 32 caracteres. Cambiarlo no altera las cuentas existentes, pero los números nuevos podrían repetir uno
# ya entregado: una vez en uso, no lo cambies.
account.number-secret=${ACCOUNT_NUMBER_SECRET}
