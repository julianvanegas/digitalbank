# Perfil de las pruebas de integración (*IT). Da valores de prueba a las variables de entorno que exige
# application.properties. La conexión a la base la pone el contenedor de Testcontainers (@ServiceConnection), así que
# DB_HOST y DB_NAME solo existen para que los marcadores se resuelvan. Ningún valor de aquí es un secreto real.

SERVER_PORT=0
CORS_ALLOWED_ORIGINS=http://localhost

DB_HOST=localhost:5432
DB_NAME=unused
DB_USERNAME=unused
DB_PASSWORD=unused
DB_POOL_SIZE=5
FLYWAY_ENABLED=true

JWT_SECRET=integration-test-jwt-secret-with-more-than-32-chars
JWT_EXPIRATION_MS=3600000
SESSION_INACTIVITY_TIMEOUT_MINUTES=15
VERIFICATION_HMAC_SECRET=integration-test-hmac-secret-with-more-than-32-chars
VERIFICATION_RESEND_INTERVAL_SECONDS=60
ACCOUNT_NUMBER_SECRET=integration-test-account-secret-with-more-than-32-chars

RESEND_API_KEY=re_test_not_a_real_key
RESEND_FROM_NAME=DigitalBank Test
RESEND_FROM_EMAIL=no-reply@example.com

SWAGGER_ENABLED=false

# Los trabajos programados no corren solos durante las pruebas: cada prueba los invoca cuando los necesita
scheduling.enabled=false
